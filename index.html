<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Absensi PKL</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  padding: 20px;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
}

.camera-box {
  margin-top: 20px;
  width: 100%;
  background: #111;
  border-radius: 15px;
  overflow: hidden;
}

video {
  width: 100%;
  display: block;
}

canvas {
  display: none;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.btn-camera {
  background: #2563eb;
  color: white;
}

.btn-foto {
  background: #16a34a;
  color: white;
}

.btn-absen {
  background: #7c3aed;
  color: white;
}

button:disabled {
  background: #aaa;
  cursor: not-allowed;
}

.status {
  margin-top: 20px;
  padding: 15px;
  background: #f8fafc;
  border-radius: 10px;
  line-height: 1.8;
}

.success {
  color: #15803d;
  font-weight: bold;
}

.error {
  color: #dc2626;
  font-weight: bold;
}

.preview {
  width: 100%;
  margin-top: 15px;
  border-radius: 12px;
  display: none;
}

</style>

</head>


<body>

<div class="container">

<h1>📋 Absensi PKL</h1>


<label>Nama Lengkap</label>

<input
  type="text"
  id="nama"
  placeholder="Masukkan nama lengkap"
>


<label>Kelas</label>

<input
  type="text"
  id="kelas"
  placeholder="Contoh: XII RPL 1"
>


<div class="camera-box">

<video
  id="video"
  autoplay
  playsinline
></video>

</div>


<button
  class="btn-camera"
  onclick="bukaKamera()"
>
📷 Buka Kamera
</button>


<button
  class="btn-foto"
  onclick="ambilFoto()"
  disabled
  id="btnFoto"
>
🤳 Ambil Foto
</button>


<canvas id="canvas"></canvas>

<img
  id="preview"
  class="preview"
>


<div class="status">

<strong>Status:</strong>

<div id="statusKamera">
⏳ Kamera belum aktif
</div>

<div id="statusLokasi">
📍 Mencari lokasi...
</div>

</div>


<button
  class="btn-absen"
  onclick="kirimAbsensi()"
  id="btnAbsen"
  disabled
>
✅ KIRIM ABSENSI
</button>


<div id="hasil"></div>

</div>


<script>


// ==========================================
// URL APPS SCRIPT
// ==========================================

const APPS_SCRIPT_URL =
"https://script.google.com/a/macros/sma.belajar.id/s/AKfycby2rybHLgM_UVbJ0RzKmTxWPbcaZ3CJKDplBTmBTnk/exec";


// ==========================================
// VARIABEL
// ==========================================

let stream = null;

let fotoBase64 = null;

let latitude = null;

let longitude = null;


// ==========================================
// SAAT HALAMAN DIBUKA
// ==========================================

window.onload = function() {

  ambilLokasi();

};


// ==========================================
// BUKA KAMERA
// ==========================================

async function bukaKamera() {

  try {

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: false

      });


    const video =
      document.getElementById("video");


    video.srcObject = stream;


    document.getElementById("statusKamera")
      .innerHTML =
      "✅ Kamera aktif";


    document.getElementById("btnFoto")
      .disabled = false;


  }

  catch (error) {

    console.error(error);


    document.getElementById("statusKamera")
      .innerHTML =
      "❌ Kamera tidak bisa dibuka";


    alert(
      "Kamera tidak bisa digunakan. Pastikan izin kamera sudah diberikan."
    );

  }

}


// ==========================================
// AMBIL FOTO
// ==========================================

function ambilFoto() {

  const video =
    document.getElementById("video");


  const canvas =
    document.getElementById("canvas");


  const preview =
    document.getElementById("preview");


  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  fotoBase64 =
    canvas.toDataURL(
      "image/jpeg",
      0.8
    );


  preview.src =
    fotoBase64;


  preview.style.display =
    "block";


  document.getElementById("btnAbsen")
    .disabled = false;


  alert("Foto berhasil diambil!");


}


// ==========================================
// AMBIL LOKASI OTOMATIS
// ==========================================

function ambilLokasi() {

  if (!navigator.geolocation) {

    document.getElementById("statusLokasi")
      .innerHTML =
      "❌ Browser tidak mendukung GPS";

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      latitude =
        position.coords.latitude;


      longitude =
        position.coords.longitude;


      document.getElementById("statusLokasi")
        .innerHTML =
        "📍 Lokasi berhasil didapat";


    },


    function(error) {

      console.error(error);


      document.getElementById("statusLokasi")
        .innerHTML =
        "❌ Lokasi tidak bisa didapat";


    },

    {

      enableHighAccuracy: true,

      timeout: 10000,

      maximumAge: 0

    }

  );

}


// ==========================================
// KIRIM ABSENSI
// ==========================================

async function kirimAbsensi() {


  const nama =
    document.getElementById("nama")
      .value.trim();


  const kelas =
    document.getElementById("kelas")
      .value.trim();


  // ----------------------------------------
  // Validasi
  // ----------------------------------------

  if (!nama) {

    alert("Nama belum diisi!");

    return;

  }


  if (!kelas) {

    alert("Kelas belum diisi!");

    return;

  }


  if (!fotoBase64) {

    alert("Silakan ambil foto terlebih dahulu!");

    return;

  }


  if (!latitude || !longitude) {

    alert("Lokasi belum tersedia!");

    return;

  }


  // ----------------------------------------
  // Tombol loading
  // ----------------------------------------

  const btn =
    document.getElementById("btnAbsen");


  btn.disabled = true;

  btn.innerText =
    "⏳ Mengirim absensi...";


  // ----------------------------------------
  // Data yang dikirim
  // ----------------------------------------

  const data = {

    nama: nama,

    kelas: kelas,

    latitude: latitude,

    longitude: longitude,

    foto: fotoBase64

  };


  try {


    const response =
      await fetch(

        APPS_SCRIPT_URL,

        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(data)

        }

      );


    const hasil =
      await response.json();


    console.log(hasil);


    // --------------------------------------
    // Jika berhasil
    // --------------------------------------

    if (
      hasil.status === "success"
    ) {


      document.getElementById("hasil")
        .innerHTML = `

          <div class="status success">

            ✅ ABSENSI BERHASIL!

            <br><br>

            Nama: ${nama}

            <br>

            Kelas: ${kelas}

            <br>

            📍 Lokasi berhasil disimpan

            <br>

            📷 Foto berhasil disimpan

          </div>

        `;


      btn.innerText =
        "✅ ABSENSI TERKIRIM";


      // Matikan kamera

      if (stream) {

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

      }


    }

    else {

      throw new Error(
        hasil.message ||
        "Gagal menyimpan absensi"
      );

    }


  }

  catch (error) {


    console.error(error);


    document.getElementById("hasil")
      .innerHTML = `

        <div class="status error">

          ❌ Gagal mengirim absensi.

          <br><br>

          ${error.message}

        </div>

      `;


    btn.disabled = false;

    btn.innerText =
      "✅ KIRIM ABSENSI";

  }

}


</script>

</body>

</html>
